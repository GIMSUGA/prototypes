<div class="wrap page">
  {{ partial "members-gate.html" (dict "who" "members" "title" "Businesses") }}
  <div class="stack" data-show="member admin">
    <h1>Businesses</h1>
    <p class="lede">Businesses and services run by chapter members.</p>
    <p><a class="btn btn--quiet btn--small" href="{{ "members/my-businesses/" | relURL }}">Add or edit your business</a></p>
    <ul class="list-cards">
      {{- range sort hugo.Data.people.businesses "name" }}
      {{ partial "business-card.html" (dict "b" . "owner" true) }}
      {{- end }}
    </ul>
  </div>
</div>
