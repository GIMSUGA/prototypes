{{- $here := .RelPermalink -}}
{{- $a := hugo.Data.association -}}
<header class="topbar">
  <div class="wrap topbar__inner">
    <a class="brand" href="{{ "" | relURL }}">
      <span class="brand__mark" aria-hidden="true">G</span>
      <span class="brand__text"><strong>{{ $a.name }}</strong><small>{{ $a.chapter }}</small></span>
    </a>
    <nav class="topnav" aria-label="Main">
      <ul>
        {{- range hugo.Data.nav }}
        {{- $url := .href | relURL }}
        <li data-show="{{ .show }}"><a href="{{ $url }}"{{ if eq $here $url }} aria-current="page"{{ end }}>{{ .label }}</a></li>
        {{- end }}
      </ul>
    </nav>
    <div class="topbar__account">
      <button type="button" class="btn btn--small" data-show="guest" data-open="signin" id="signin-button">Sign in</button>
      <button type="button" class="account-btn" data-show="member admin" data-open="account" id="account-button" aria-haspopup="dialog">
        <span class="avatar avatar--small" aria-hidden="true" data-account-initial></span>
        <span class="account-btn__name" data-account-name></span>
      </button>
    </div>
  </div>
</header>
