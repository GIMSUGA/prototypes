{{- /* "Search in" choice for directories, shown only with "All GIMSUGA". Context: dict "list" (list id) "id" (select id). */ -}}
<div class="scope" data-scopes="multi">
  <label class="search" for="{{ .id }}">Search in</label>
  <select class="scope__select" id="{{ .id }}" data-scope-for="{{ .list }}">
    <option value="abakaliki" selected>Abakaliki chapter</option>
    {{- range hugo.Data.association.chapters }}{{ if ne .id "abakaliki" }}
    <option value="{{ .id }}">{{ .name }} chapter</option>
    {{- end }}{{ end }}
    <option value="all">All GIMSUGA chapters</option>
  </select>
  <p class="note" data-scope-note="{{ .list }}" hidden>Members from other chapters appear only if they chose "All GIMSUGA members" in their profile.</p>
</div>
