<div class="demobar" role="region" aria-label="Prototype controls" data-collapsed="true">
  <div class="demobar__inner">
    <p class="demobar__notice">
      <strong>Prototype — not a real site.</strong>
      Everyone shown is fictional. Nothing you do here leaves your browser.
    </p>
    <div class="demobar__summary">
      <p class="demobar__state" data-demo-summary aria-live="polite"></p>
      <button type="button" class="demobar__toggle" aria-expanded="false" aria-controls="demo-controls" data-demo-toggle>Change</button>
    </div>
    <form class="demobar__controls" id="demo-controls" data-demo-controls>
      <fieldset class="seg">
        <legend>Option</legend>
        <label><input type="radio" name="dir" value="A" id="dir-a"><span>A <small>Lean</small></span></label>
        <label><input type="radio" name="dir" value="B" id="dir-b"><span>B <small>Members</small></span></label>
        <label><input type="radio" name="dir" value="C" id="dir-c"><span>C <small>Community</small></span></label>
      </fieldset>
      <fieldset class="seg">
        <legend>View as</legend>
        <label><input type="radio" name="as" value="visitor" id="as-visitor"><span>Visitor</span></label>
        <label><input type="radio" name="as" value="member" id="as-member"><span>Member</span></label>
        <label><input type="radio" name="as" value="officer" id="as-officer"><span>Officer</span></label>
      </fieldset>
      <fieldset class="seg">
        <legend>Website</legend>
        <label><input type="radio" name="chapters" value="single" id="chapters-single"><span>Chapter site</span></label>
        <label><input type="radio" name="chapters" value="multi" id="chapters-multi"><span>Multi-chapter site</span></label>
      </fieldset>
      <p class="demobar__links">
        <a href="{{ "" | relURL }}#try">Stories</a>
        <a href="{{ "" | relURL }}#tell">Give your views</a>
      </p>
    </form>
  </div>
</div>
