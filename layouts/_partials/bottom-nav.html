{{- $here := .RelPermalink -}}
<nav class="bottomnav" aria-label="Main" id="bottom-nav">
  <ul>
    {{- range hugo.Data.nav }}
    <li data-show="{{ .show }}">
      <a href="{{ .href | relURL }}"{{ if partial "nav-current.html" (dict "item" . "here" $here) }} aria-current="page"{{ end }}>
        {{ partial "icon.html" .icon }}
        <span>{{ .label }}</span>
      </a>
    </li>
    {{- end }}
  </ul>
</nav>
