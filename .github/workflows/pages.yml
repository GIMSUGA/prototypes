name: Build and publish prototypes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: "0.166.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Hugo ${{ env.HUGO_VERSION }}
        run: |
          curl -fsSL -o hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf hugo.tar.gz hugo
          sudo mv hugo /usr/local/bin/hugo
          hugo version

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build
        run: hugo --minify --panicOnWarning --baseURL "${{ steps.pages.outputs.base_url || 'https://gimsuga.github.io/prototypes' }}/"

      - name: Check the build
        run: |
          test -f public/index.html
          for page in gimsuga abakaliki abakaliki/officers abakaliki/events abakaliki/our-work abakaliki/join members members/businesses members/profile community officer privacy; do
            test -f "public/$page/index.html" || { echo "Missing page: $page"; exit 1; }
          done
          if grep -rIl --include='*.html' -E 'wa\.me/|chat\.whatsapp\.com' public; then echo "WhatsApp link found"; exit 1; fi
          grep -q 'data-story-id="c3"' public/officer/index.html || { echo "Story guide missing"; exit 1; }
          missing=$(grep -rL --include='*.html' 'noindex' public || true)
          if [ -n "$missing" ]; then echo "Pages without noindex:"; echo "$missing"; exit 1; fi

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
