name: Publish the redirect to the chapter site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      # The demo is retired (G-062). Every address, old links included, now sends visitors to the
      # chapter's own site. The Hugo demo stays in this repository's history and files, unpublished.
      - name: Check the redirect
        run: |
          for f in index.html 404.html; do
            test -f "redirect/$f" || { echo "Missing redirect/$f"; exit 1; }
            grep -q 'noindex' "redirect/$f" || { echo "redirect/$f has no noindex"; exit 1; }
            grep -q 'https://gimsuga.github.io/preview/' "redirect/$f" || { echo "redirect/$f does not point to the site"; exit 1; }
          done
          if grep -rIl -i 'whatsapp\|wa\.me' redirect; then echo "WhatsApp mention found"; exit 1; fi

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: redirect

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
